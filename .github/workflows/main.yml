name: Cypress Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.15.0 # this image has Cypress and browsers pre-installed
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
